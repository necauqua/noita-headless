services:
  noita:
    build: .
    image: noita-headless
    # Pass Noita cmdline args by overriding command, e.g.
    #   docker compose run --rm noita -gamemode 0
    # Disable individual pre-seeding steps (all default to 1):
    #   NOITA_SKIP_INTRO          touch save00/.../flags/intro_has_played
    #   NOITA_SKIP_RELEASE_NOTES  write save_shared/config.xml w/ version hash
    #   NOITA_AUTO_ENABLE_MODS    write save00/mod_config.xml from /noita/mods/*
    volumes:
      - ./appdata:/appdata
      - ./noita:/noita:ro
      - ./mods:/noita/mods:ro
      - wineprefix:/wineprefix

volumes:
  wineprefix:
