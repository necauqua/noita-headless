services:
  noita:
    build: .
    image: noita-headless
    # Pass Noita cmdline args by overriding command, e.g.
    #   docker compose run --rm noita -gamemode 0
    # Optional env var: NOITA_WORLD_SEED=<int> -> SetWorldSeed via harness mod.
    volumes:
      - ./appdata:/appdata
      - ./noita:/noita:ro
      - ./mods:/user-mods:ro
      - wineprefix:/wineprefix
    # /noita/mods is a tmpfs so the entrypoint can merge baked-in mods
    # (/opt/noita-docker-mods, includes the noita-docker-harness mod) with
    # user-supplied mods (/user-mods) into a single mod search directory
    # without writing into the read-only /noita bind-mount.
    tmpfs:
      - /noita/mods

volumes:
  wineprefix:
